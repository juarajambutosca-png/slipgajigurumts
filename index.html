<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slip Bisyaroh Amplop (152 x 95 mm)</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root { --primary:#0f172a; --accent:#16a34a; --bg:#f1f5f9; --text:#1e293b; --danger:#dc2626; }
  * { box-sizing: border-box; }
  body { font-family:'Segoe UI',Arial,sans-serif; background:var(--bg); margin:0; color:var(--text); }
  .top-bar { background:var(--primary); color:#fff; padding:12px 20px; text-align:center; font-size:16px; font-weight:700; }
  .control-panel { background:#fff; max-width:950px; margin:15px auto; padding:15px 20px; border-radius:8px;
    box-shadow:0 2px 10px rgba(0,0,0,.06); display:flex; gap:15px; align-items:flex-end; flex-wrap:wrap; }
  .form-group { display:flex; flex-direction:column; gap:4px; }
  .form-group label { font-size:11px; font-weight:700; color:#64748b; }
  select, input[type=file], input[type=text] { padding:8px 10px; border:1px solid #cbd5e1; border-radius:6px; font-size:12px; background:#f8fafc; }
  input[type=text] { min-width:220px; }
  .btn-print { background:var(--accent); color:#fff; border:none; padding:10px 20px; font-weight:700; border-radius:6px;
    cursor:pointer; margin-left:auto; font-size:13px; }
  .btn-print:hover { background:#15803d; }
  #warningContainer { max-width:950px; margin:0 auto 15px; }
  .alert-box { background:#fef2f2; border-left:4px solid var(--danger); padding:12px 16px; border-radius:6px; color:#991b1b; font-size:12px; margin-bottom:8px; }
  .alert-box.info { background:#fffbeb; border-left-color:#d97706; color:#92400e; }
  .alert-box ul { margin:4px 0 0 18px; padding:0; }
  #previewArea { display:flex; flex-direction:column; align-items:center; gap:20px; padding-bottom:50px; }
  .empty { color:#64748b; margin-top:50px; font-size:14px; }

  /* Kartu amplop 152 x 95 mm */
  .envelope-card { width:152mm; height:95mm; background:#fff; padding:5mm 6mm; border:1px solid #cbd5e1;
    box-shadow:0 4px 15px rgba(0,0,0,.1); display:flex; flex-direction:column; overflow:hidden; color:#000; }
  .kop { display:flex; align-items:center; justify-content:center; gap:8px; border-bottom:2px solid #000; padding-bottom:3px; margin-bottom:4px; }
  .kop img { max-height:12mm; max-width:12mm; object-fit:contain; }
  .kop-text { text-align:center; font-weight:800; font-size:8.5pt; line-height:1.2; text-transform:uppercase; flex-grow:1; }
  .nama-bar { font-weight:700; font-size:9.5pt; margin-bottom:4px; }
  .grid { display:flex; justify-content:space-between; gap:4mm; border-top:1px solid #000; border-bottom:1px solid #000; padding:4px 0; font-size:8.5pt; flex:1; min-height:0; }
  .col { width:50%; display:flex; flex-direction:column; justify-content:space-between; }
  .col-title { font-weight:700; margin-bottom:4px; border-bottom:1px dashed #888; padding-bottom:2px; }
  .item { display:flex; justify-content:space-between; gap:6px; margin-bottom:2px; line-height:1.2; }
  .item span:last-child { white-space:nowrap; }
  .sub { display:flex; justify-content:space-between; font-weight:700; border-top:1px dashed #000; padding-top:3px; margin-top:3px; }
  .dense .grid { font-size:7.5pt; } .dense .item { margin-bottom:1px; line-height:1.15; }
  .bottom { display:flex; justify-content:space-between; align-items:flex-end; margin-top:4px; }
  .total { font-weight:700; font-size:9.5pt; background:#f8fafc; padding:5px 8px; border:1px solid #94a3b8; display:flex; gap:10px; }
  .total.neg { color:#b91c1c; }
  .ttd { font-size:8pt; line-height:1.2; width:48mm; }
  .ttd-space { height:20px; }

  @media print {
    .no-print { display:none !important; }
    body { background:#fff; margin:0; }
    #previewArea { padding:0; gap:0; display:block; }
    .envelope-card { box-shadow:none; border:none; padding:5mm 6mm; page-break-after:always; break-after:page; page-break-inside:avoid; }
    @page { size:152mm 95mm; margin:0; }
  }
</style>
</head>
<body>

<div class="top-bar no-print">Generator Slip Bisyaroh Amplop (152 x 95 mm)</div>

<div class="control-panel no-print">
  <div class="form-group">
    <label>1. Upload Excel</label>
    <input type="file" id="excelFile" accept=".xlsx,.xls">
  </div>
  <div class="form-group">
    <label>2. Pilih bulan / sheet</label>
    <select id="sheetSelect" disabled><option>-- Upload Excel dulu --</option></select>
  </div>
  <div class="form-group">
    <label>3. Tanggal slip (di atas Bendahara)</label>
    <input type="text" id="tglInput" placeholder="Alasdowo, 31 Oktober 2026">
  </div>
  <div class="form-group">
    <label>4. Filter guru / tendik</label>
    <select id="personSelect" disabled><option value="ALL">-- Tampilkan semua --</option></select>
  </div>
  <button class="btn-print" onclick="window.print()">Cetak / Simpan PDF</button>
</div>

<div id="warningContainer" class="no-print"></div>
<div id="previewArea"><div class="empty no-print">Upload file Excel <b>Bisyaroh Guru dan Tendik</b> untuk melihat preview.</div></div>

<script>
const LOGO_URL = "https://lh3.googleusercontent.com/d/1ypnFZQcbp4tlOQUHNFvoS4PJuC1a6ctW";
const BENDAHARA = "MU'LINATUSSA'ADAH";
const BULAN = ['JANUARI','FEBRUARI','MARET','APRIL','MEI','JUNI','JULI','AGUSTUS','SEPTEMBER','OKTOBER','NOVEMBER','DESEMBER'];
// singkatan nama sheet -> indeks bulan (cadangan jika sel "Bulan:" tidak ada)
const SINGKATAN = { JAN:0, FEB:1, MAR:2, APR:3, MEI:4, JUN:5, JUL:6, AGU:7, SEP:8, OKT:9, NOV:10, NOP:10, DES:11 };

let workbook = null, rows = [], bulanLabel = '', tglManual = false;

const $ = id => document.getElementById(id);
$('excelFile').addEventListener('change', onFile);
$('sheetSelect').addEventListener('change', processSheet);
$('personSelect').addEventListener('change', render);
$('tglInput').addEventListener('input', () => { tglManual = true; render(); });

const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rp = n => (n < 0 ? '-' : '') + 'Rp ' + Math.abs(Math.round(n)).toLocaleString('id-ID');
const cap = s => s.charAt(0) + s.slice(1).toLowerCase();

function cleanNumber(v) {
  if (v === null || v === undefined || v === '' || v === '-') return 0;
  if (typeof v === 'number') return v;
  const s = String(v).trim();
  const digits = s.replace(/[^0-9]/g, '');
  if (!digits) return 0;
  const neg = s.includes('-') || (s.includes('(') && s.includes(')'));
  return neg ? -parseFloat(digits) : parseFloat(digits);
}

function sanitizeLabel(l) { return String(l || '').replace(/^[0-9]+[.)\-]\s*/, '').replace(/\s+/g, ' ').trim(); }

// Ambil "Oktober 2026" dari sel "Bulan: Oktober 2026"; cadangan: tebak dari nama sheet
function getBulan(ws, sheetName) {
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });
  for (let i = 0; i < Math.min(8, raw.length); i++) {
    for (const c of raw[i]) {
      const m = String(c).match(/bulan\s*:\s*(.+)/i);
      if (m) return m[1].replace(/\s+/g, ' ').trim().toUpperCase();
    }
  }
  const parts = sheetName.replace(/\./g, ' ').trim().split(/\s+/);
  const key = (parts[0] || '').toUpperCase().slice(0, 3);
  let thn = parts[1] || '';
  if (/^\d{2}$/.test(thn)) thn = '20' + thn;
  return key in SINGKATAN ? `${BULAN[SINGKATAN[key]]} ${thn}`.trim() : sheetName.toUpperCase();
}

// "OKTOBER 2026" -> "Alasdowo, 30 Oktober 2026"
function tglDefault(label) {
  const m = label.match(/^([A-Z]+)\s+(\d{4})$/);
  if (!m) return 'Alasdowo, ';
  const idx = BULAN.indexOf(m[1]);
  if (idx < 0) return 'Alasdowo, ';
  const hari = Math.min(30, new Date(+m[2], idx + 1, 0).getDate());
  return `Alasdowo, ${hari} ${cap(m[1])} ${m[2]}`;
}

function onFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    workbook = XLSX.read(new Uint8Array(ev.target.result), { type: 'array' });
    const sel = $('sheetSelect');
    sel.innerHTML = '';
    workbook.SheetNames.forEach(n => sel.add(new Option(n, n)));
    // pilih sheet terakhir (bulan terbaru) secara bawaan
    sel.value = workbook.SheetNames[workbook.SheetNames.length - 1];
    sel.disabled = false;
    tglManual = false;
    processSheet();
  };
  reader.readAsArrayBuffer(file);
}

function processSheet() {
  if (!workbook) return;
  const name = $('sheetSelect').value;
  const ws = workbook.Sheets[name];
  const raw = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '' });

  // cari baris header (yang memuat "nama" dan "diterima")
  const hRow = raw.findIndex(r => r.some(c => /nama/i.test(c)) && r.some(c => /diterima/i.test(c)));
  if (hRow < 0) { alert('Header tidak ditemukan (harus ada kolom "Nama" dan "Jumlah yang diterima").'); return; }

  bulanLabel = getBulan(ws, name);
  if (!tglManual) $('tglInput').value = tglDefault(bulanLabel);

  const h = raw[hRow].map(x => String(x).trim());
  const low = h.map(x => x.toLowerCase());
  const iNama = low.findIndex(x => x.includes('nama'));
  const iTerima = low.findIndex(x => x.includes('diterima'));
  const iJml = [];
  low.forEach((x, i) => { if (x.startsWith('jumlah') && !x.includes('diterima') && !x.includes('jam')) iJml.push(i); });
  if (iJml.length < 2) { alert('Kolom "Jumlah" (penerimaan dan potongan) tidak lengkap.'); return; }
  const [iA, iB] = iJml;

  const skip = i => !h[i] || low[i] === 'no' || low[i] === 'no.' || low[i].startsWith('jml jam') || low[i].includes('tanda tangan');
  const colsA = [], colsB = [];
  h.forEach((x, i) => {
    if (skip(i)) return;
    if (i > iNama && i < iA) colsA.push({ i, name: sanitizeLabel(x) });
    else if (i > iA && i < iB) colsB.push({ i, name: sanitizeLabel(x) });
  });

  rows = [];
  raw.slice(hRow + 1).forEach((r, k) => {
    const nama = String(r[iNama] ?? '').trim();
    if (!nama || /^(jumlah|total)$/i.test(nama)) return;   // lewati baris kosong & baris total
    const pick = cols => cols.map(c => ({ label: c.name, val: Math.round(cleanNumber(r[c.i])) })).filter(x => x.val > 0);
    const itemsA = pick(colsA), itemsB = pick(colsB);
    const totalA = itemsA.reduce((s, x) => s + x.val, 0);
    const totalB = itemsB.reduce((s, x) => s + x.val, 0);
    rows.push({
      baris: hRow + k + 2, nama, itemsA, itemsB, totalA, totalB, net: totalA - totalB,
      xlA: Math.round(cleanNumber(r[iA])), xlB: Math.round(cleanNumber(r[iB])), xlNet: Math.round(cleanNumber(r[iTerima]))
    });
  });

  const ps = $('personSelect');
  ps.innerHTML = '<option value="ALL">-- Tampilkan semua --</option>';
  rows.forEach((p, i) => ps.add(new Option(p.nama, i)));
  ps.disabled = false;
  checkWarnings();
  render();
}

function checkWarnings() {
  const box = $('warningContainer');
  const beda = rows.filter(p => p.totalA !== p.xlA || p.totalB !== p.xlB || p.net !== p.xlNet);
  const minus = rows.filter(p => p.net < 0);
  let html = '';
  if (beda.length) {
    html += `<div class="alert-box"><b>Hitungan tidak sama dengan Excel (${beda.length} orang):</b><ul>` +
      beda.map(p => `<li>Baris ${p.baris}, ${esc(p.nama)}: aplikasi ${rp(p.net)}, Excel ${rp(p.xlNet)}</li>`).join('') + '</ul></div>';
  }
  if (minus.length) {
    html += `<div class="alert-box info"><b>Jumlah diterima minus (${minus.length} orang):</b><ul>` +
      minus.map(p => `<li>${esc(p.nama)}: ${rp(p.net)}</li>`).join('') + '</ul></div>';
  }
  box.innerHTML = html;
}

function cardHTML(p) {
  const dense = Math.max(p.itemsA.length, p.itemsB.length) > 6 ? ' dense' : '';
  const list = items => items.length
    ? items.map(x => `<div class="item"><span>${esc(x.label)}</span><span>${rp(x.val)}</span></div>`).join('')
    : '<div class="item"><span>-</span><span></span></div>';
  return `
  <div class="envelope-card${dense}">
    <div class="kop">
      <img src="${LOGO_URL}" alt="" onerror="this.style.display='none'">
      <div class="kop-text">Bisyaroh Guru dan Tenaga Kependidikan<br>MTs. Tarbiyatul Banin Banat Alasdowo<br>${esc(bulanLabel)}</div>
    </div>
    <div class="nama-bar">Nama: ${esc(p.nama)}</div>
    <div class="grid">
      <div class="col"><div>
        <div class="col-title">A. Penerimaan</div>${list(p.itemsA)}</div>
        <div class="sub"><span>Jumlah A</span><span>${rp(p.totalA)}</span></div>
      </div>
      <div class="col"><div>
        <div class="col-title">B. Potongan</div>${list(p.itemsB)}</div>
        <div class="sub"><span>Jumlah B</span><span>${rp(p.totalB)}</span></div>
      </div>
    </div>
    <div class="bottom">
      <div class="total${p.net < 0 ? ' neg' : ''}"><span>Diterima (A - B)</span><span>${rp(p.net)}</span></div>
      <div class="ttd">${esc($('tglInput').value.trim())}<br>Bendahara
        <div class="ttd-space"></div><b>${esc(BENDAHARA)}</b></div>
    </div>
  </div>`;
}

function render() {
  const area = $('previewArea');
  if (!rows.length) return;
  const sel = $('personSelect').value;
  const list = sel === 'ALL' ? rows : [rows[+sel]];
  area.innerHTML = list.map(cardHTML).join('');
}
</script>
</body>
</html>
